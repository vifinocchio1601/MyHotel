<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyHotel</title>
<meta name="theme-color" content="#0f1a17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf2ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyHotel">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : la tablette du directeur, pensée d'abord pour le téléphone. Une colonne : barre d'état avec l'horloge réelle,
   quatre jauges, puis l'écran courant. Une barre d'onglets fixe en bas donne accès aux cinq écrans les plus utilisés.
   Même famille que MyHospital ; ici le fond est vert bouteille et l'accent laiton, comme un hall d'hôtel. */
:root{
  color-scheme:dark;
  --bg:#0f1a17; --surface:#16251f; --surface-2:#1d3028; --line:#2b4338;
  --ink:#e9f1ec; --muted:#98ab9f; --faint:#6f8478;
  --accent:#d3a44e; --accent-2:#b98933; --on-accent:#1c1404; --on-tile:#ffffff;
  --ok:#5fca92; --ok-bg:#153a2a; --warn:#e5b54a; --warn-bg:#3b3016; --bad:#f2786f; --bad-bg:#40201e; --info:#7fb9e6; --info-bg:#17324a; --nuit:#b7a2ee; --nuit-bg:#2c2649;
  --tri-rouge:#e5484d; --tri-orange:#f08c3a; --tri-jaune:#e6c13d; --tri-vert:#46b97a; --tri-bleu:#4c9be8;
  --c1:#3f8fe0; --c1b:#2a6ab3; --c2:#3fa796; --c2b:#2c7f73; --c3:#d9647a; --c3b:#a8425a; --c4:#8468cf; --c4b:#6144ad;
  --c5:#c8922f; --c5b:#96671a; --c6:#4f9d5d; --c6b:#35743f; --c7:#cf7f55; --c7b:#9c5632; --c8:#7d8794; --c8b:#535c68;
  --voile:rgba(5,14,11,.62);
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-doc:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:20px; --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#edf2ee; --surface:#ffffff; --surface-2:#f1f6f2; --line:#d5e0d8;
    --ink:#13241c; --muted:#52675b; --faint:#7f9186;
    --accent:#8a6410; --accent-2:#6f500b; --on-accent:#ffffff;
    --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
    --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
    --voile:rgba(19,36,28,.38);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf2ee; --surface:#ffffff; --surface-2:#f1f6f2; --line:#d5e0d8;
  --ink:#13241c; --muted:#52675b; --faint:#7f9186;
  --accent:#8a6410; --accent-2:#6f500b; --on-accent:#ffffff;
  --ok:#1b7a4a; --ok-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdefd2; --bad:#b3261e; --bad-bg:#fde5e2; --info:#1f5c99; --info-bg:#e4eef8; --nuit:#5a3fae; --nuit-bg:#ebe6fa;
  --tri-rouge:#d1343a; --tri-orange:#dd7420; --tri-jaune:#c79a12; --tri-vert:#2f9a5f; --tri-bleu:#2f7fd0;
  --voile:rgba(19,36,28,.38);
}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ecran{max-width:920px;margin-inline:auto;padding-inline:16px;padding-block:14px 112px;display:flex;flex-direction:column;gap:20px}

/* Barre d'état */
.barre{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.marque{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:15px;min-width:0}
.marque span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:18px;flex:none}
.puce{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.puce svg{width:14px;height:14px}
.puce.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.puce.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.puce.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.puce.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.puce.num{font-variant-numeric:tabular-nums}

/* Titres */
.titre{display:flex;flex-direction:column;gap:4px}
.titre h1{font-size:clamp(26px,7vw,36px);line-height:1.12;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.titre p{color:var(--muted)}
h2{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.retour{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);font-weight:500;align-self:flex-start}
.retour:hover{color:var(--ink)}
.aide{color:var(--muted);font-size:13.5px}

/* Jauges */
.jauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.jauge-nom{font-size:12.5px;color:var(--muted);font-weight:500}
.jauge-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.piste{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.plein{height:100%;border-radius:3px;background:var(--warn);transition:width .5s ease}
.n2 .plein{background:var(--ok)} .n0 .plein{background:var(--bad)} .nn .plein{background:var(--accent)}
.n0 .jauge-val{color:var(--bad)}
.jauge-bas{font-size:12px;color:var(--faint);min-height:18px}

/* Tuiles */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tuile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.tuile:hover{border-color:var(--faint);transform:translateY(-1px)}
.tuile-icone{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--on-tile);flex:none}
.tuile-icone svg{width:24px;height:24px}
.g1{background:linear-gradient(160deg,var(--c1),var(--c1b))} .g2{background:linear-gradient(160deg,var(--c2),var(--c2b))}
.g3{background:linear-gradient(160deg,var(--c3),var(--c3b))} .g4{background:linear-gradient(160deg,var(--c4),var(--c4b))}
.g5{background:linear-gradient(160deg,var(--c5),var(--c5b))} .g6{background:linear-gradient(160deg,var(--c6),var(--c6b))}
.g7{background:linear-gradient(160deg,var(--c7),var(--c7b))} .g8{background:linear-gradient(160deg,var(--c8),var(--c8b))}
.tuile-texte{display:flex;flex-direction:column;gap:1px;min-width:0}
.tuile-nom{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tuile-chiffre{color:var(--muted);font-size:13.5px}

/* Boutons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink);min-height:42px}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn svg{width:17px;height:17px}
.btn.principal{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.principal:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.large{padding:14px 20px;font-size:16px;width:100%}
.btn.petit{padding:6px 12px;font-size:13.5px;min-height:34px}

/* Alertes */
.alertes{display:flex;flex-direction:column;gap:8px}
.alerte{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:500;background:var(--info-bg);color:var(--info);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.alerte.warn{background:var(--warn-bg);color:var(--warn)} .alerte.bad{background:var(--bad-bg);color:var(--bad)} .alerte.ok{background:var(--ok-bg);color:var(--ok)}
.alerte .btn{background:transparent;border-color:currentColor;color:inherit}

/* Cartes et listes */
.bloc{display:flex;flex-direction:column;gap:10px;min-width:0}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.carte-haut{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.carte-haut h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.carte-haut small{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.entete{display:flex;gap:12px;align-items:center;min-width:0}
.entete .tuile-icone{width:40px;height:40px;border-radius:12px}
.entete .tuile-icone svg{width:20px;height:20px}
.liste{display:flex;flex-direction:column;gap:8px}
.rang{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.rang > div:first-child{min-width:0;flex:1 1 180px}
.rang b{font-weight:600}
.rang small{display:block;color:var(--muted);font-size:13px}
.rang .droite{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rang.moi{border-color:var(--info)}
.vide{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reglage > span{color:var(--muted);font-size:14px}
.pas{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.pas button{width:44px;height:42px;background:none;border:0;font-size:20px;font-weight:600;color:var(--ink)}
.pas button:hover:not(:disabled){background:var(--line)}
.pas output{min-width:86px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.progres{display:flex;flex-direction:column;gap:5px}
.progres-haut{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.progres-haut span{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* Triage (échelle de Manchester) */
.tri{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.tri i{width:9px;height:9px;border-radius:50%;background:var(--tri-vert)}
.t-rouge i{background:var(--tri-rouge)} .t-orange i{background:var(--tri-orange)} .t-jaune i{background:var(--tri-jaune)} .t-bleu i{background:var(--tri-bleu)}
.dossier{font-family:var(--f-doc);font-size:11.5px;color:var(--faint);letter-spacing:.02em}

/* Onglets et tableaux */
.onglets{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.onglet{flex:1;padding:10px 6px;background:none;border:0;border-right:1px solid var(--line);font-weight:600;color:var(--muted);font-size:14px}
.onglet:last-child{border-right:0}
.onglet.actif{background:var(--accent);color:var(--on-accent)}
.periode{display:flex;justify-content:space-between;align-items:center;gap:8px}
.periode b{font-size:16px;text-align:center;flex:1;min-width:0}
.periode .btn{padding:8px 12px}
.puces-choix{display:flex;gap:8px;flex-wrap:wrap}
.choix{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.choix.actif{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tableau{overflow-x:auto}
.tableau table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tableau th,.tableau td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tableau th:first-child,.tableau td:first-child{text-align:left;padding-left:0;white-space:normal}
.tableau th:last-child,.tableau td:last-child{padding-right:0}
.tableau thead th{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tableau tr.sous td{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:14px;border-bottom:0}
.tableau tr.total td{font-weight:700}
.tableau td.avant{color:var(--muted)}
.tableau tbody tr:last-child td{border-bottom:0}
.tableau.serre th,.tableau.serre td{padding:8px 4px;font-size:13px}
.tableau.serre thead th{font-size:10.5px;letter-spacing:.03em}
.plus-c{color:var(--ok)} .moins-c{color:var(--bad)}
.journal li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.journal li:last-child{border-bottom:0}
.journal time{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.journal .warn{color:var(--warn)} .journal .bad{color:var(--bad)} .journal .ok{color:var(--ok)}

/* Fondation */
.champ{display:flex;flex-direction:column;gap:6px;min-width:0}
.champ label,.champ > span{font-size:13px;color:var(--muted);font-weight:500}
.champ input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;width:100%;font-size:16px}

/* Barre d'onglets du bas */
.bas{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.bas > div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:min(560px,100%)}
.bas button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;position:relative;min-width:0}
.bas button.actif{color:var(--accent)}
.bas svg{width:22px;height:22px}
.pastille{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tri-orange);color:var(--on-tile);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Planning : une semaine type par personne, un bouton par jour */
.semaine{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.jour{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);min-width:0;color:var(--faint)}
.jour small{font-size:11px;font-weight:600;color:var(--muted)}
.jour b{font-size:12.5px;font-weight:700}
.jour.p-M{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.jour.p-A{background:var(--info-bg);border-color:transparent;color:var(--info)}
.jour.p-N{background:var(--nuit-bg);border-color:transparent;color:var(--nuit)}
.jour.ici{outline:2px solid var(--accent);outline-offset:1px}
.tableau table.grille th,.tableau table.grille td{text-align:center;padding:8px 2px}
.tableau table.grille th:first-child{text-align:left;white-space:nowrap;color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
.grille th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.grille td.zero{color:var(--faint)}
.grille td.ici{background:var(--info-bg);color:var(--info);font-weight:700}
.grille thead th.ici{color:var(--accent)}

/* Pharmacie et traitement */
.choix small{font-weight:500;opacity:.8}
.choix.rupture:not(.actif){border-color:var(--bad);color:var(--bad)}
.sous-titre{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.bascule{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.bascule button{padding:9px 16px;background:none;border:0;font-weight:600;color:var(--muted)}
.bascule button.actif{background:var(--accent);color:var(--on-accent)}

/* Fiches */
.signes{display:flex;gap:6px;flex-wrap:wrap}
.signe{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.signe.ctx{background:var(--info-bg);color:var(--info);border-color:transparent}
.signe.oui{border-color:var(--accent)}
.signe.non{color:var(--faint);font-weight:500}
.test{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
button.test:hover:not(:disabled){border-color:var(--faint)}
.test b{font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.test b span{color:var(--muted);font-weight:500;font-size:13px;text-align:right}
.test small{font-size:13.5px;color:var(--muted)}
.test.fait{background:var(--surface)}
.test.anormal small{color:var(--warn);font-weight:600}
.cand{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);min-width:0}
.cand.actif{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cand > button{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:none;border:0;padding:12px}
.cand-nom{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cand .fiche{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.cand .fiche.seule{padding-top:12px}
.cand .fiche ul{display:flex;flex-direction:column;gap:4px}
.cand .fiche li{font-size:13.5px;color:var(--muted)}
.cand .fiche li b{color:var(--ink);font-weight:600}


/* Chambres, clients et équipements */
.etoiles{color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.equips{font-size:13px;color:var(--muted)}
.cand-prix{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cand-prix b{color:var(--ink);font-weight:700}
.option{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
button.option:hover:not(:disabled){border-color:var(--faint)}
.option b{font-weight:600}
.option small{font-size:13px;color:var(--muted)}
.parole{font-size:16px;font-weight:600;line-height:1.4}
.groupe-choix{display:flex;flex-direction:column;gap:6px}
.onglets.cinq .onglet{font-size:12.5px;padding:10px 2px;min-width:0}
.carte > .sous-titre{margin-top:4px}

/* Agenda */
.tableau table.agenda th,.tableau table.agenda td{padding:3px 2px}
.tableau table.agenda th:first-child{padding-right:4px;font-size:12px}
.case{display:block;border:0;border-radius:7px;padding:6px 2px;font-size:11px;font-weight:600;min-width:30px;width:100%;text-align:center;background:none;color:var(--faint);font-family:inherit}
.case.occ{background:var(--info-bg);color:var(--info)}
.case.blo{background:var(--warn-bg);color:var(--warn)}
.case.sel{outline:2px solid var(--accent);outline-offset:1px}
.case.legende{display:inline-block;width:auto;min-width:0;padding:2px 8px}
.agenda td.manque{color:var(--warn);font-weight:700}
@media (min-width:760px){
  .jauges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .btn.large{width:auto}
  .deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

function inscrire(t,poste,montant){
  var j=cleJour(t), m=cleMois(t), sens=SENS[poste.charAt(0)];
  montant=Math.round(montant); if(!montant) return;
  if(!S.cj[j]) S.cj[j]={}; if(!S.cm[m]) S.cm[m]={};
  S.cj[j][poste]=(S.cj[j][poste]||0)+montant; S.cm[m][poste]=(S.cm[m][poste]||0)+montant;
  S.caisse+=montant*(sens===undefined?-1:sens);
}

function inscrireF(t,poste,montant){

  if(entier>=1){ inscrire(t,poste,entier); total-=entier; }

}

// Un client ordinaire paie sur place ; pour une société, la facture part sur le lot du jour.
function recette(t,compte,ttc,canal){

  ttc=Math.round(ttc); if(!ttc) return;
  tva=taux?partTva(ttc,taux):0;
  inscrire(t,"r:"+compte,ttc-tva);
  if(tva){ inscrire(t,"v:"+compte,tva); S.tvaP[GRILLE_VENTE[taux]]+=ttc-tva; S.tvaP.g54+=tva; }
  if(canal!=="entreprise") return;
  inscrire(t,"c:entreprises",ttc);
  S.bordereaux.forEach(function(x){ if(x.jour===k) b=x; });
  if(!b){ b={id:S.nBord++,jour:k,t:t,m:0,n:0,ech:jourApres(t,entre(DELAI_FACTURE[0],DELAI_FACTURE[1]))}; S.bordereaux.push(b); }
  b.m+=ttc; b.n++;
}
// Un achat : le prix payé est TVA comprise. La charge (ou le bien) est hors TVA, la TVA est à récupérer. Renvoie le montant hors TVA.
function achat(t,poste,ttc,taux,grille){
  var tva;
  ttc=Math.round(ttc); if(!ttc) return 0;
  tva=taux?partTva(ttc,taux):0;
  inscrire(t,poste,ttc-tva);
  if(tva){ inscrire(t,"u:"+poste.slice(2),tva); S.tvaP[grille]+=ttc-tva; S.tvaP.g59+=tva; }

function reglements(t){
  S.bordereaux=S.bordereaux.filter(function(b){
    var mc=0;
    if(b.ech>t) return true;
    if(Math.random()<TAUX_CONTESTE) mc=Math.round(b.m*alea(0.05,0.15));
    inscrire(t,"d:entreprises",b.m-mc);
    if(mc>0){ S.contestes.push({id:S.nBord++,jour:b.jour,t:b.t,m:mc,limite:jourApres(t,LIMITE_CONTESTE),relance:0}); noter(t,"warn","Une société conteste "+mt(mc)+" sur les factures du "+dateLongue(b.t)+". Relancez-la dans Finances."); }
    return false;

    if(c.relance&&c.relance<=t){ inscrire(t,"d:entreprises",c.m); noter(t,"ok","Après relance, la société règle "+mt(c.m)+" de factures contestées."); return false; }

/* ------------------------------------------------------------------ TVA, clôture et impôt */
function nomTrimestre(t){ var d=new Date(t), q=Math.floor(d.getMonth()/3)+1; return q+(q===1?"er":"e")+" trimestre "+d.getFullYear(); }
function finTrimestre(t){ var d=new Date(t); return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3+3,1).getTime(); }
function moisDuTrimestre(t){ var d=new Date(t), m0=Math.floor(d.getMonth()/3)*3, l=[], i; for(i=0;i<3;i++) l.push(cleMois(new Date(d.getFullYear(),m0+i,1).getTime())); return l; }
// Ce que l'hôtel doit à l'État en TVA (ou, en négatif, ce que l'État lui doit) : le trimestre en cours et les déclarations pas encore déposées
function soldeTva(){ var n=S.tvaP.g54-S.tvaP.g59; S.declarations.forEach(function(d){ n+=d.g54-d.g59; }); return n; }
function cloturerTva(tj,t){
  var d={id:S.nFisc++,nom:nomTrimestre(tj)}, L=new Date(t), k;
  for(k in S.tvaP) d[k]=S.tvaP[k];
  L.setDate(21); d.limite=L.getTime();
  S.declarations.push(d); S.tvaP=tvaVide();
  noter(t,"","Le "+d.nom+" est terminé : la déclaration de TVA est à déposer avant le "+dateLongue(d.limite-1000)+", dans Finances.");
}
function deposerTva(d,t,office){
  var solde=d.g54-d.g59, amende=0, i=S.declarations.indexOf(d);
  if(i>=0) S.declarations.splice(i,1);
  if(solde>0) inscrire(t,"t:tva",solde); else if(solde<0) inscrire(t,"z:tva",-solde);
  if(office){ amende=Math.max(50,Math.round(Math.max(0,solde)*0.1)); inscrire(t,"x:divers",amende); }
  S.tvaHisto.unshift({nom:d.nom,solde:solde,t:t,amende:amende}); if(S.tvaHisto.length>8) S.tvaHisto.length=8;
  noter(t,office?"bad":"","Déclaration de TVA du "+d.nom+(office?" déposée d'office, en retard : ":" déposée : ")+(solde>0?mt(solde)+" payés à l'État":solde<0?mt(-solde)+" remboursés par l'État":"rien à payer")+(office?", plus "+mt(amende)+" d'amende.":"."));
}
// Le résultat du trimestre avant impôt
function resultatExercice(t){ var tot=additionner(S.cm,moisDuTrimestre(t)); return recettesDe(tot)-depensesDe(tot)+typeDe(tot,"y"); }
function dettesImpot(){ var n=0; S.impots.forEach(function(x){ n+=x.m; }); return n; }
// À minuit le dernier jour du trimestre : l'impôt est calculé, la réserve légale dotée, et le reste attend la décision du directeur
function cloturerExercice(tj,t){
  var R=resultatExercice(tj), imposable=0, impot, net, dot=0, L, ex;
  if(S.affectation) affecterResultat(0,t,true);
  if(R>0){ imposable=Math.max(0,R-S.pertes); S.pertes=Math.max(0,S.pertes-R); } else S.pertes+=-R;
  impot=Math.round(imposable*TAUX_ISOC);
  if(impot){ inscrire(tj,"y:impot",impot); L=new Date(t); L.setMonth(L.getMonth()+1); S.impots.push({id:S.nFisc++,nom:nomTrimestre(tj),m:impot,limite:L.getTime()}); }
  net=R-impot;
  if(net>0){ dot=Math.min(Math.round(net*PART_RESERVE),Math.max(0,Math.round(S.capital*PLAFOND_RESERVE)-S.reserve)); S.reserve+=dot; }
  ex={nom:nomTrimestre(tj),resultat:R,impot:impot,net:net,reserve:dot,dividende:0};
  S.exercices.unshift(ex); if(S.exercices.length>12) S.exercices.length=12;
  if(net>0&&S.reporte+net-dot>0) S.affectation={nom:ex.nom,net:net-dot,dispo:S.reporte+net-dot,limite:jourApres(t,DELAI_AFFECTATION)};
  else S.reporte+=net-dot;
  noter(t,net>=0?"ok":"warn","Clôture du "+ex.nom+" : résultat avant impôt "+signeM(R)+(impot?", impôt des sociétés "+mt(impot)+" à payer avant le "+dateLongue(L.getTime()-1000):R>0?", pas d'impôt grâce aux pertes reportées":", pas d'impôt")+"."+(S.affectation?" Il vous reste à décider du dividende, dans Finances.":""));
}
// Ce que le directeur peut se verser : pas plus que le bénéfice disponible, ni que ce que la caisse contient
function dividendeMax(){ return S.affectation?Math.max(0,Math.min(S.affectation.dispo,Math.floor(S.caisse))):0; }
function affecterResultat(D,t,office){
  var X=S.affectation, pourMoi;
  if(!X) return;
  D=borne(Math.round(D),0,dividendeMax());
  S.reporte+=X.net-D; S.affectation=null;
  if(D){ pourMoi=Math.round(D*(1-PRECOMPTE)); inscrire(t,"b:dividende",D); S.moi.argent+=pourMoi; S.moi.gagne+=pourMoi; S.moi.dividendes=(S.moi.dividendes||0)+pourMoi; }
  S.exercices.forEach(function(e){ if(e.nom===X.nom) e.dividende=D; });
  noter(t,"","Résultat du "+X.nom+(D?" : dividende de "+mt(D)+", dont "+mt(pourMoi)+" pour "+S.prenom+" après le précompte mobilier. Le reste est reporté.":" : tout est reporté à l'exercice suivant."+(office?" Aucune décision n'avait été prise.":"")));
}
function payerImpot(x,t,retard){
  var i=S.impots.indexOf(x), maj=retard?Math.round(x.m*0.1):0;
  if(i>=0) S.impots.splice(i,1);
  inscrire(t,"t:impot",x.m);
  if(maj) inscrire(t,"x:divers",maj);
  noter(t,retard?"bad":"","Impôt des sociétés du "+x.nom+" : "+mt(x.m)+" payés"+(retard?" d'office, en retard, plus "+mt(maj)+" de majoration.":"."));
}
// Le bilan. Les capitaux propres se détaillent ; le résultat de l'exercice en cours est ce qui reste une fois le reste retiré.
function bilan(){
  var tva=soldeTva(), b={brut:0,amort:0,stock:valeurStock(),creances:creances(),tresorerie:Math.max(0,S.caisse),decouvert:Math.max(0,-S.caisse),pret:S.moi.pret};
  S.immos.forEach(function(im){ b.brut+=im.v; b.amort+=im.c; });
  b.tvaActif=Math.max(0,-tva); b.tvaPassif=Math.max(0,tva); b.impots=dettesImpot(); b.acomptes=S.acomptes||0;
  b.actif=b.brut-b.amort+b.stock+b.creances+b.tvaActif+b.tresorerie;
  b.propres=b.actif-b.pret-b.decouvert-b.tvaPassif-b.impots-b.acomptes;
  b.capital=S.capital; b.reserve=S.reserve; b.reporte=S.reporte; b.aAffecter=S.affectation?S.affectation.net:0;
  b.exercice=b.propres-b.capital-b.reserve-b.reporte-b.aAffecter;
  return b;
}
function amortir(t){
  S.immos.forEach(function(im){ var d; if(im.c>=im.v) return; d=Math.min(im.v/DUREE_AMORT,im.v-im.c); im.c+=d; inscrireF(t,"a:"+im.sv,d); });
}
function valeurStock(){ var n=0, k; for(k in S.valStock) n+=S.valStock[k]; S.commandes.forEach(function(c){ n+=c.v||0; }); return n; }
function additionner(src,cles){ var tot={}, i, k, o; for(i=0;i<cles.length;i++){ o=src[cles[i]]; if(o) for(k in o) tot[k]=(tot[k]||0)+o[k]; } return tot; }
function recettesDe(tot){ var k, n=0; for(k in tot) if(k.charAt(0)==="r") n+=tot[k]; return n; }
function depensesDe(tot){ var k, n=0; for(k in tot) if(TYPES_CHARGE.indexOf(k.charAt(0))>=0) n+=tot[k]; return n; }
function typeDe(tot,type){ var k, n=0; for(k in tot) if(k.charAt(0)===type) n+=tot[k]; return n; }
function serviceDe(tot,sv){ var k, r=0, d=0; for(k in tot) if(k.slice(2)===sv){ if(k.charAt(0)==="r") r+=tot[k]; else if(TYPES_CHARGE.indexOf(k.charAt(0))>=0) d+=tot[k]; } return {r:r,d:d}; }
function resultatJour(){ var c=S.cj[cleJour(maintenant())]||{}; return recettesDe(c)-depensesDe(c); }
function noter(t,classe,texte){ S.journal.unshift({t:t,c:classe,m:texte}); if(S.journal.length>JOURNAL_MAX) S.journal.length=JOURNAL_MAX; }

// Une marchandise sort du stock à son coût moyen d'achat : c'est à ce moment qu'elle devient une charge du service qui la consomme
function sortirStock(k,t,sv){
  var n=stockDe(k), cu=n>0?(S.valStock[k]||0)/n:0;
  S.stock[k]=n-1; S.valStock[k]=Math.max(0,(S.valStock[k]||0)-cu); inscrireF(t,"g:"+sv,cu);
}

/* ------------------------------------------------------------------ L'hôtel à un instant donné */
function reputation(){ var n=0, i; for(i=0;i<S.avis.length;i++) n+=S.avis[i]; return S.avis.length?n/S.avis.length:50; }
function avis(note){ S.avis.push(borne(Math.round(note),0,100)); if(S.avis.length>AVIS_MAX) S.avis.shift(); }
function niv(k){ return (S.equip&&S.equip[k])||0; }
function capEquip(){ return Math.min(EQUIP_MAX,S.palier+1); }
function entretienDe(k){ var n=0, i; for(i=0;i<niv(k);i++) n+=EQUIP[k].couts[i]*PART_ENTRETIEN; return Math.round(n); }
function entretienEquip(){ var n=0, k; for(k in EQUIP) n+=entretienDe(k); return n; }
function capDe(k){ var n=niv(k); return n&&EQUIP[k].cap?EQUIP[k].cap[n-1]:0; }
function saisonDe(t){ var m=new Date(t).getMonth(); return m===11||m<2?0:m<5?1:m<8?2:3; }
function forme(k){ return !!(S.moi.formations&&S.moi.formations[k]); }
function bonusPlaque(){ var n=0; PLAQUES.forEach(function(x){ if(S.moi.dons>=x[0]) n=x[2]; }); return n; }
function chargesBatiment(){ return Math.round((PALIERS[S.palier].charges+S.chambres.length*ENTRETIEN_CHAMBRE)*(forme("gestionnaire")?0.85:1)); }
function chargesJour(){ return chargesBatiment()+entretienEquip()+PRIME_ASSURANCE[S.palier]; }
function etoiles(n){ return n?new Array(n+1).join("★"):""; }
function nomPalier(i){ var e=etoiles(PALIERS[i].etoiles); return PALIERS[i].nom+(e?" "+e:""); }
function prochainPalier(){ return PALIERS[S.palier+1]||null; }
// Les jours de l'hôtel vont de 6 h à 6 h : une arrivée à 2 h du matin compte pour la nuit en cours
function jourHotel(t){ return minuit(t-6*HEURE); }
// Telle heure de la pendule, tel jour : juste aussi les jours de changement d'heure. Au-delà de 24, c'est le lendemain.
function aHeure(jour,hh){ var d=new Date(jour); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,Math.round(hh*60),0,0).getTime(); }
// De 22 h à 6 h, l'hôtel dort : personne n'arrive, personne ne travaille
function nuit(t){ var hh=new Date(t).getHours(); return hh>=22||hh<6; }

// Chambres
function chambre(id){ return parId(S.chambres,id); }
function prixRef(c){ return Math.round(TYPES[c.type].prix*COTES[c.cote].mult*NIVEAUX[c.niv].mult); }
function prixChambre(c){ return Math.round(prixRef(c)*S.tarifs.chambre/100); }
function typePour(n){ return n<=1?"simple":n===2?"double":"familiale"; }
// Un client logé dans une chambre plus grande que nécessaire paie le prix d'une chambre à sa taille
function prixPour(sj,c){ return Math.min(prixChambre(c),Math.round(TYPES[typePour(sj.pers)].prix*COTES[c.cote].mult*NIVEAUX[c.niv].mult*S.tarifs.chambre/100)); }
function prixAchat(type,cote){ return Math.round(TYPES[type].achat*COTES[cote].achat/50)*50; }
function pretes(){ return S.chambres.filter(function(c){ return !c.sj&&c.etat==="propre"; }); }
function occupees(){ var n=0; S.chambres.forEach(function(c){ if(c.sj) n++; }); return n; }
function equipementsDe(c){ var l=[], i; for(i=2;i<=c.niv;i++) l.push(NIVEAUX[i].nom); return l; }
function descChambre(c){ return TYPES[c.type].nom+" · "+COTES[c.cote].nom.toLowerCase()+" · "+ETAGES[c.etage].toLowerCase(); }
function souhaitOk(k,c,prix){
  if(k==="calme") return c.cote==="jardin";
  if(k==="rez") return c.etage==="rez";
  if(k==="haut") return c.etage==="haut";
  if(k==="grandlit") return c.type==="double"||c.type==="familiale";
  if(k==="separes") return c.type==="twin";
  if(k==="budget") return prix<=SEUIL_BUDGET;
  return c.niv>=NIV_DE[k];
}
// À quel point une chambre convient à un client, de 0 à 100 : ses souhaits, et le niveau auquel il s'attend
function adequation(sj,c,prix){
  var n=60;
  sj.souhaits.forEach(function(k){ n+=souhaitOk(k,c,prix)?10:-8; });
  if(c.niv>=sj.att) n+=Math.min(10,4+(c.niv-sj.att)*3); else n-=Math.min(24,(sj.att-c.niv)*6);
  if(c.defaut) n-=10;
  return borne(n,0,100);
}
function parEtat(e){ return S.sejours.filter(function(x){ return x.etat===e; }); }
function sejourDe(c){ return c.sj?parId(S.sejours,c.sj):null; }
// L'agenda : une réservation peut avoir une chambre bloquée (bloc). Une chambre bloquée ne peut pas recevoir un autre client sur ces nuits-là.
function blocsDe(c,sauf){ return S.sejours.filter(function(x){ return x.bloc===c.id&&x.id!==sauf&&(x.etat==="reserve"||x.etat==="accueil"); }); }
// Une chambre est-elle libre de a à b ? Ni occupée par un client encore là, ni bloquée pour une autre réservation.
function libreSur(c,a,b,sauf){
  var sj=sejourDe(c);
  if(sj&&sj.id!==sauf&&sj.fin>a) return false;
  return !blocsDe(c,sauf).some(function(x){ return x.arrive<b&&x.finPrevue>a; });
}
// Les chambres où l'on peut installer un client tout de suite, et celles qu'on peut bloquer pour une réservation
function chambresPour(sj){ var t=S.horloge; return S.chambres.filter(function(c){ return !c.sj&&c.etat==="propre"&&TYPES[c.type].cap>=sj.pers&&libreSur(c,t,sj.finPrevue,sj.id); }); }
function chambresABloquer(sj){ return S.chambres.filter(function(c){ return TYPES[c.type].cap>=sj.pers&&libreSur(c,Math.max(S.horloge,sj.arrive),sj.finPrevue,sj.id); }); }
function aPlacer(){ return S.sejours.filter(function(x){ return x.etat==="reserve"&&!x.bloc; }); }
// Ce qui manquera à un client dans une chambre donnée
function manquesDe(sj,c,prix){ return sj.souhaits.filter(function(k){ return !souhaitOk(k,c,prix); }).map(function(k){ return SOUHAITS[k].toLowerCase(); }); }
// Toutes les réservations sans chambre bloquée trouvent-elles une chambre assez grande ? On place chacune, par ordre d'arrivée, dans la plus petite chambre libre.
// extra : un séjour de plus à caser. bloque : une chambre qu'on s'apprête à donner à un client déjà là.
function tient(extra,bloque){
  var t=S.horloge, occ={}, l=[], ok=true;
  S.chambres.forEach(function(c){ var sj=sejourDe(c); occ[c.id]=sj?[[0,sj.fin]]:[]; });
  if(bloque) occ[bloque.ch].push([0,bloque.jusqua]);
  S.sejours.forEach(function(x){
    if((x.etat!=="reserve"&&x.etat!=="accueil")||(bloque&&x.id===bloque.sj)) return;
    if(x.bloc&&occ[x.bloc]) occ[x.bloc].push([Math.max(t,x.arrive),x.finPrevue]); else l.push(x);
  });
  if(extra) l.push(extra);
  l.sort(function(a,b){ return a.arrive-b.arrive||b.pers-a.pers; });
  l.forEach(function(x){
    var a=Math.max(t,x.arrive), b=x.finPrevue, mieux=null;
    S.chambres.forEach(function(c){
      if(TYPES[c.type].cap<x.pers) return;
      if(occ[c.id].some(function(i){ return i[0]<b&&i[1]>a; })) return;
      if(!mieux||TYPES[c.type].cap<TYPES[mieux.type].cap) mieux=c;
    });
    if(mieux) occ[mieux.id].push([a,b]); else ok=false;
  });
  return ok;
}
function placesLibres(){ var n=capDe("parking"); S.sejours.forEach(function(x){ if(x.etat==="loge"&&x.parking) n--; }); return n; }
function attenteOk(k,sj){ return k==="parking"?!!sj.parking:niv(ATTENTES[k][1])>=ATTENTES[k][2]; }

// Économat
function stockDe(k){ return S.stock[k]||0; }
function produitsConnus(){
  return ORDRE_PRODUITS.filter(function(k){
    if(k==="pdj") return niv("resto")>=1;
    if(k==="denrees") return niv("resto")>=2;
    if(k==="boissons") return niv("bar")>=1||niv("seminaire")>=1||niv("resto")>=2;
    if(k==="soins") return niv("spa")>=1;
    return true;
  });
}
function lot(){ return LOTS[S.palier]; }
function seuilStock(){ return Math.round(lot()*0.3); }
function prixLot(k,n,auto){ return Math.round(PRODUITS[k].cout*n*(n>=lot()*FOIS_GROS?REMISE_GROS:1)*(auto?SURCOUT_AUTO:1)*(forme("negociateur")?0.9:1)*(k==="linge"?1-0.08*niv("buanderie"):1)); }
function enCommande(k){ var n=0; S.commandes.forEach(function(c){ if(c.p===k) n+=c.n; }); return n; }
function commander(k,n,t,auto){
  var prix=prixLot(k,n,auto);
  if(!PRODUITS[k]||S.caisse-prix<-DECOUVERT_MAX) return false;
  S.commandes.push({t:t+DELAI_LIVRAISON,p:k,n:n,v:achat(t,"k:economat",prix,TVA_PRODUIT[k],"g81")}); S.commandes.sort(function(a,b){ return a.t-b.t; });
  return true;
}
// Réapprovisionnement automatique : un lot dès qu'un stock est bas, plus cher qu'une commande faite à la main
function reappro(t){
  if(!S.auto) return;
  produitsConnus().forEach(function(k){ if(stockDe(k)<=seuilStock()&&!enCommande(k)) commander(k,lot(),t,true); });
}
function manquer(k){ S.stat.ruptures[k]=(S.stat.ruptures[k]||0)+1; }

// Prix et fréquentation
function refDe(k){ return k==="chambre"?100:Math.round(REF[k]*MULT_REF[k][niv(EQUIP_DE[k])]); }
function demandeCible(d){
  var k=CLES_DEMANDE[d], R=S.tarifs[k]/Math.max(1,refDe(k));
  return Math.max(0.2,R<=1?1+0.4*(1-R):1/(1+ELASTICITE*(R-1)*(R-1)));
}
function demande(d){ return S.demande&&S.demande[d]!==undefined?S.demande[d]:1; }
function ajusterDemande(){
  var d;
  if(!S.demande) S.demande={};
  for(d in CLES_DEMANDE) S.demande[d]=demande(d)+(demandeCible(d)-demande(d))*INERTIE_PRIX;
}
// Arrivées attendues par jour : elles suivent le nombre de chambres, la réputation, la saison et les prix
function attendus(t){ return S.chambres.length*ROTATION*(0.5+reputation()/100)*SAISONS[saisonDe(t)].f*demande("chambre")*(forme("communicant")?1.1:1)*(1+0.03*niv("piscine")); }

// Personnel
function absentLe(e,t){ return !!(e.absent&&t>=e.absent.debut&&t<e.absent.fin); }
// Vrai quand c'est un intérimaire qui tient le poste de la personne
function remplace(e,t){ return absentLe(e,t===undefined?S.horloge:t)&&!!e.absent.interim; }
function present(e,t){ return !absentLe(e,t)||!!e.absent.interim; }
function enPoste(e,t){
  var q;
  t=t===undefined?S.horloge:t; q=posteDe(t);
  return !!e.plan&&e.plan[q.j]===q.k&&present(e,t);
}
function humeur(e){ return e.humeur&&S.horloge<e.humeur.fin?e.humeur.v:0; }
function paieInterim(e,k){ return k==="R"?0:Math.round(S.postes[e.role].salaire*PRIME_INTERIM*(k==="N"?PRIME_NUIT:1)); }
function nb(role){ var n=0, i; for(i=0;i<S.equipe.length;i++) if(S.equipe[i].role===role) n++; return n; }
function nbGroupe(l){ var n=0; S.equipe.forEach(function(e){ if(l.indexOf(e.role)>=0) n++; }); return n; }
function enPosteRole(l,t){ return S.equipe.filter(function(e){ return l.indexOf(e.role)>=0&&enPoste(e,t); }); }
function enPosteMaintenant(){ var n=0; S.equipe.forEach(function(e){ if(enPoste(e)) n++; }); return n; }
// Ceux d'un groupe de métiers qui travaillent aujourd'hui, quel que soit leur poste
function auTravail(l){ var j=posteDe(S.horloge).j, n=0; S.equipe.forEach(function(e){ if(l.indexOf(e.role)>=0&&e.plan[j]!=="R"&&present(e,S.horloge)) n++; }); return n; }
function nbPostes(e,k){ var n=0; e.plan.forEach(function(x){ if(k?x===k:x!=="R") n++; }); return n; }
function prevusLe(l,j,k,t){ var n=0; S.equipe.forEach(function(e){ if(l.indexOf(e.role)>=0&&e.plan[j]===k&&(!t||present(e,t))) n++; }); return n; }
// Ce qu'une personne a en main : tables en cours de service et chambres en cours de ménage
function charge(e){
  var n=0;
  S.visites.forEach(function(v){ if(v.etat==="service"&&v.staff.indexOf(e.id)>=0) n++; });
  S.chambres.forEach(function(c){ if(c.etat==="menage"&&c.men&&c.men.qui===e.id) n++; });
  return n;
}
function estTache(e){ return !!CHARGE[e.role]; }
// La meilleure personne en poste qui a encore une main libre, parmi une liste de métiers
function dispo(l,t){
  var m=null;
  S.equipe.forEach(function(e){
    if(l.indexOf(e.role)<0||!enPoste(e,t)||charge(e)>=(CHARGE[e.role]||1)) return;
    if(!m||qualite(e)>qualite(m)) m=e;
  });
  return m;
}

}

/* ------------------------------------------------------------------ Restaurant, bar et spa */
function enService(sv){ var n=0; S.visites.forEach(function(v){ if(v.sv===sv&&v.etat==="service") n++; }); return n; }
function enFile(sv){ var n=0; S.visites.forEach(function(v){ if(v.sv===sv&&v.etat==="attente") n++; }); return n; }
function moiCharge(){ var n=0; S.visites.forEach(function(v){ if(v.etat==="service"&&v.moi) n++; }); return n; }
function ouvertPour(k){ return niv(SV[k].sv)>=(k==="midi"||k==="soir"?2:1)&&!((k==="midi"||k==="soir")&&evenementLe(S.horloge,k)); }
function creerVisite(t,k,n,sj){
  S.visites.push({id:S.nVisite++,k:k,sv:SV[k].sv,n:n,sj:sj||null,arrive:t,limite:t+SV[k].patience*MIN,etat:"attente",staff:[]});
}
// Chaque table attend une place libre et le personnel qu'il lui faut. Sans serveur en poste, le directeur sert lui-même le petit-déjeuner, deux tables à la fois.
function affecterVisites(t){
  var file=S.visites.filter(function(v){ return v.etat==="attente"; }).sort(function(a,b){ return a.arrive-b.arrive; }), fait=false;
  file.forEach(function(v){
    var X=SV[v.k], a=null, b=null, moi=false, d, i;
    if(enService(v.sv)>=capDe(v.sv)) return;
    if(v.sv==="resto"){
      a=dispo(["serveur"],t);
      if(v.k==="pdj"){ if(!a){ if(enPosteRole(["serveur"],t).length||moiCharge()>=2) return; moi=true; } }
      else { b=dispo(CUISINE,t); if(!a||!b) return; }
    } else if(v.sv==="bar"){ a=dispo(["barman"],t); if(!a) return; }
    else { a=dispo(["praticien"],t); if(!a) return; }
    d=X.duree*(moi?1.2:remplace(a,t)?1:(1+EXP[a.exp].vitesse)/2);
    v.etat="service"; v.debut=t; v.fin=t+Math.max(10,Math.round(d))*MIN; v.staff=[a,b].filter(Boolean).map(function(e){ return e.id; });
    v.moi=moi; v.q=moi?0.95:b?(qualite(a)+qualite(b))/2:qualite(a); v.att=(t-v.arrive)/MIN; fait=true;
    for(i=0;i<v.n;i++){ if(stockDe(X.stock)>0) sortirStock(X.stock,t,v.sv); else { v.rupture=1; manquer(X.stock); break; } }
  });
  if(fait) reappro(t);
}
function oterVisite(v){ var i=S.visites.indexOf(v); if(i>=0) S.visites.splice(i,1); }
function finVisite(v,t){

  recette(t,v.sv,prix,"direct");
  v.staff.forEach(function(id){ var e=parId(S.equipe,id); if(e){ e.faits=(e.faits||0)+1; if(!remplace(e,t)) gagnerXp(e,1,t); } });
  note=borne(70+(v.q-1)*60-Math.min(25,v.att/X.patience*25)-(v.rupture?25:0)+(niv(v.sv)-1)*2,0,100);
  if(sj){ sj.plus=(sj.plus||0)+(note>=60?3:-5); sj.paye+=prix; }
  else if(Math.random()<0.25) avis(note);
  S.stat.visites[v.sv]=(S.stat.visites[v.sv]||0)+1;
  if(v.sv==="resto") S.stat.couverts+=v.n;

}
function visiteRatee(v,t){

/* ------------------------------------------------------------------ Les demandes des clients */
function ouvrirRequete(sj,t){
  var c=chambre(sj.ch), cles=Object.keys(REQUETES).filter(function(k){ return !REQUETES[k].si||REQUETES[k].si(sj,c); });
  if(S.requetes.some(function(r){ return r.sj===sj.id; })) return;
  S.requetes.push({id:S.nRequete++,sj:sj.id,k:tirer(cles),t:t,limite:t+DELAI_REQ,auto:t+RELAIS_REQ});
}
// Une chambre libre et prête où déplacer un client : n'importe laquelle d'aussi bien, une côté jardin, ou une de meilleur niveau
function chambrePour(sj,mode){
  var c0=chambre(sj.ch), l=pretes().filter(function(c){
    if(TYPES[c.type].cap<sj.pers||!libreSur(c,S.horloge,sj.finPrevue,sj.id)) return false;
    if(mode==="jardin") return c.cote==="jardin"&&c.niv>=c0.niv-1;
    if(mode==="mieux") return c.niv>c0.niv;
    return c.niv>=c0.niv;
  }), bons;
  if(mode==="jardin"&&c0.cote==="jardin") return null;
  bons=l.filter(function(c){ return tient(null,{ch:c.id,jusqua:sj.finPrevue,sj:sj.id}); });
  if(bons.length) l=bons;
  l.sort(function(a,b){ return adequation(sj,b,sj.prixNuit)-adequation(sj,a,sj.prixNuit); });
  return l[0]||null;
}
// Renvoie la raison pour laquelle une réponse est impossible, ou une chaîne vide
function optionDispo(r,o){
  var sj=parId(S.sejours,r.sj), b=o.besoin;
  if(!sj) return "Le client est parti";
  if(b==="technicien"&&!enPosteRole(["technicien"]).length) return nb("technicien")?"Aucun technicien en poste":"Il faut un technicien";
  if(b==="femme"&&!enPosteRole(FEMMES).length) return nbGroupe(FEMMES)?"Personne aux étages en ce moment":"Il faut une femme de chambre";
  if(b==="cuisinier"&&!enPosteRole(CUISINE).length) return nbGroupe(CUISINE)?"Aucun cuisinier en poste":"Il faut un cuisinier";
  if(b==="concierge"&&!enPosteRole(["concierge"]).length) return nb("concierge")?"Aucun concierge en poste":"Il faut un concierge";
  if(b==="resto2"&&niv("resto")<2) return "L'hôtel n'a pas de restaurant";
  if(b==="resto1"&&niv("resto")<1) return "L'hôtel ne sert pas le petit-déjeuner";
  if((b==="chambre"||b==="jardin"||b==="mieux")&&!chambrePour(sj,b)) return "Aucune chambre prête qui convienne";
  if(o.stock&&stockDe(o.stock)<1) return "Rupture : "+PRODUITS[o.stock].nom.toLowerCase();
  return "";
}
function optionsDe(r){ return REQUETES[r.k].o.filter(function(o){ return !optionDispo(r,o); }).sort(function(a,b){ return b.e-a.e; }); }
function oterRequete(r){ var i=S.requetes.indexOf(r); if(i>=0) S.requetes.splice(i,1); }
function repondre(r,o,t,auto){
  var sj=parId(S.sejours,r.sj), mieux=optionsDe(r)[0], c, n, m, bon;
  oterRequete(r);
  if(!sj) return null;
  bon=!!mieux&&o.e>=mieux.e;
  if(o.cout) achat(t,"e:reception",o.cout,TVA_NORMALE,"g82");
  if(o.remise){ m=Math.round(sj.prixNuit*o.remise*(o.sejour?sj.nuits:1)); recette(t,"chambres",-m,"direct"); sj.paye-=m; }
  if(o.supp){ m=o.supp<1?Math.round(sj.prixNuit*o.supp):o.supp; recette(t,"chambres",m,"direct"); sj.paye+=m; }
  if(o.stock&&stockDe(o.stock)>0){ sortirStock(o.stock,t,o.sv||"reception"); reappro(t); }
  if(o.recette){ m=S.tarifs[o.recette]*sj.pers; recette(t,"resto",m,"direct"); sj.paye+=m; }
  if(o.tardif){ sj.tardif=1; sj.fin=aHeure(sj.fin,14); sj.finPrevue=Math.max(sj.finPrevue,sj.fin); }
  if(o.visite){ S.arrivees.push({t:Math.max(t+10*MIN,aHeure(t,alea(19,20.5))),k:"vis",v:o.visite,sj:sj.id}); S.arrivees.sort(function(a,b){ return a.t-b.t; }); }
  if(o.besoin==="chambre"||o.besoin==="jardin"||o.besoin==="mieux"){
    n=chambrePour(sj,o.besoin); c=chambre(sj.ch);
    if(n){ c.sj=null; c.etat="sale"; n.sj=sj.id; sj.ch=n.id; sj.adeq=Math.max(sj.adeq,adequation(sj,n,sj.prixNuit)); affecterMenage(t); }
  }
  sj.plus=(sj.plus||0)+o.e;
  if(auto) S.req.auto++; else if(bon) S.req.ok++; else S.req.moyen++;
  return {bon:bon,mieux:mieux};
}
// Sans réponse du directeur, le concierge ou la réception s'en charge, avec ce qu'il y a de possible
function repondreSeul(r,t){
  var e=relaisRequete(), l=optionsDe(r), q;
  if(!e||!l.length){ r.auto=0; return; }
  q=qualite(e)+(e.role==="concierge"?0.15:0);
  repondre(r,Math.random()<borne(0.55+(q-1)*0.5,0.35,0.95)||l.length<2?l[0]:l[1],t,true);
  e.faits=(e.faits||0)+1; if(!remplace(e,t)) gagnerXp(e,1,t);
}
function requetePerdue(r,t){
  var sj=parId(S.sejours,r.sj);
  if(sj) sj.plus=(sj.plus||0)-10;
  S.req.sans++; S.stat.sansReponse++; oterRequete(r);

/* ------------------------------------------------------------------ Mariages et banquets */
// Le restaurant se privatise pour un repas. Le client demande un devis par invité ; s'il le trouve trop cher, il annonce son maximum.
// À la signature, il verse un acompte. Le jour venu, tout dépend du personnel prévu, du stock et des chambres bloquées pour les invités.
function placesBanquet(){ return capDe("resto")*4; }
function refBanquet(){ return Math.round(refDe("repas")*1.5); }
function besoinsEv(ev){ return {serveurs:Math.ceil(ev.n/20),cuisiniers:Math.ceil(ev.n/40),denrees:ev.n,boissons:ev.n*2}; }
function posteEv(ev){ return ev.service==="midi"?"M":"A"; }
function prevusEv(ev){ var j=jourSemaine(ev.debut), k=posteEv(ev); return {serveurs:prevusLe(["serveur"],j,k,ev.debut),cuisiniers:prevusLe(CUISINE,j,k,ev.debut)}; }
function sejoursEv(ev){ return S.sejours.filter(function(x){ return x.ev===ev.id; }); }
function evenementLe(t,service){ var k=cleJour(t); return S.evenements.some(function(e){ return e.etat==="confirme"&&e.service===service&&cleJour(e.debut)===k; }); }
function nomEv(ev){ return EVENEMENTS[ev.type].nom+" "+ev.qui; }
function nomEvBas(ev){ var s=nomEv(ev); return s.charAt(0).toLowerCase()+s.slice(1); }
// Les chambres demandées pour les invités : des réservations d'une nuit, à placer dans l'agenda. Renvoie false s'il n'y a pas la place.
function reserverEv(ev,essai){
  var l=[], i, sj, ok;
  for(i=0;i<ev.chambres;i++){
    sj=creerSejour(aHeure(ev.debut,alea(15,17.5)),tirer(["couple","couple","amis","senior"]),false);
    sj.nuits=1; sj.finPrevue=aHeure(jourApres(jourHotel(sj.arrive),1),11); sj.canal="direct"; sj.ev=ev.id; sj.attentes=[]; sj.voiture=false;
    l.push(sj); S.sejours.push(sj);
  }
  ok=tient();
  if(!ok||essai){ l.forEach(function(x){ S.sejours.splice(S.sejours.indexOf(x),1); }); S.nSejour-=l.length; }
  return ok;
}
function creerEvenement(t){
  var cles=Object.keys(EVENEMENTS), k=tirer(cles), E=EVENEMENTS[k], places=placesBanquet(), a=identite(Math.random()<0.5), b=identite(Math.random()<0.5), d, jour, i, n, ev;
  if(!places) return null;
  // La date : entre quatre et dix jours plus tard, le bon jour de la semaine
  for(i=4;i<=10;i++){ jour=jourApres(minuit(t),i); d=jourSemaine(jour+12*HEURE); if(E.jours.indexOf(d)>=0) break; }
  if(i>10) return null;
  n=Math.min(places,entre(Math.max(8,Math.round(places*E.taille[0])),Math.max(10,Math.round(places*E.taille[1]))));
  ev={id:S.nEv++,type:k,service:E.service,debut:aHeure(jour,E.service==="midi"?12.5:19),n:n,etat:"demande",limite:jourApres(minuit(t),2)+12*HEURE,prix:refBanquet(),offre:0};
  ev.qui=k==="mariage"?"de "+a.prenom+" et "+b.prenom+" "+b.nom:k==="societe"?"de la société "+a.nom:k==="anniversaire"?"de "+a.prenom+" "+a.nom:"chez les "+a.nom;
  ev.chambres=Math.min(Math.floor(S.chambres.length*0.4),Math.round(n*E.chambres*alea(0.6,1.2)));
  ev.max=Math.round(refBanquet()*alea(0.85,1.35));
  if(S.evenements.some(function(x){ return x.etat!=="fini"&&x.service===ev.service&&cleJour(x.debut)===cleJour(ev.debut); })) return null;
  S.evenements.push(ev);
  noter(t,"","Nouvelle demande : "+nomEvBas(ev)+", "+ev.n+" invités, le "+dateLongue(ev.debut)+". Un devis est attendu.");
  return ev;
}
function ambianceBudget(ev){ var r=ev.max/Math.max(1,refBanquet()); return r<0.97?"Budget serré":r<1.17?"Budget dans la moyenne":"Budget large"; }
// Le devis part. Accepté s'il tient dans le budget ; sinon le client annonce son maximum.
function envoyerDevis(ev,t){
  if(ev.etat!=="demande") return "";
  if(ev.prix<=ev.max) return signerEv(ev,ev.prix,t);
  ev.offre=ev.max; return "offre";
}
function signerEv(ev,prix,t){
  var acompte;
  if(!reserverEv(ev,false)) return "chambres";
  ev.prix=prix; ev.total=prix*ev.n; acompte=Math.round(ev.total*ACOMPTE);
  ev.acompte=acompte; ev.etat="confirme"; ev.offre=0;
  inscrire(t,"h:acomptes",acompte); S.acomptes+=acompte;
  noter(t,"ok","Devis signé : "+nomEvBas(ev)+", "+ev.n+" invités à "+mt(prix)+", soit "+mt(ev.total)+". Acompte de "+mt(acompte)+" reçu."+(ev.chambres?" "+pl(ev.chambres,"chambre est","chambres sont")+" à bloquer dans l'agenda pour les invités.":""));
  return "ok";
}
function refuserEv(ev,t,expire){
  var i=S.evenements.indexOf(ev); if(i>=0) S.evenements.splice(i,1);
  if(expire){ avis(40); noter(t,"warn","La demande pour "+nomEvBas(ev)+" est restée sans devis : le client s'est adressé ailleurs."); }
}
// Le repas a lieu. La note dépend du personnel en poste, du stock et du niveau du restaurant.
function tenirEv(ev,t){
  var B=besoinsEv(ev), serv=enPosteRole(["serveur"],t), cuis=enPosteRole(CUISINE,t), qs, qc, d=0, bo=0, i, q, qm=0, note, paye, tous=serv.concat(cuis);
  qs=Math.min(1,serv.length/B.serveurs); qc=Math.min(1,cuis.length/B.cuisiniers);
  for(i=0;i<B.denrees;i++){ if(stockDe("denrees")>0){ sortirStock("denrees",t,"banquets"); d++; } }
  for(i=0;i<B.boissons;i++){ if(stockDe("boissons")>0){ sortirStock("boissons",t,"banquets"); bo++; } }
  if(d<B.denrees) manquer("denrees"); if(bo<B.boissons) manquer("boissons");
  tous.forEach(function(e){ qm+=qualite(e); e.faits=(e.faits||0)+1; if(!remplace(e,t)) gagnerXp(e,3,t); });
  qm=tous.length?qm/tous.length:0.8;
  q=qs*qc*0.6+(d/B.denrees*0.6+bo/B.boissons*0.4)*0.4;
  note=borne(Math.round(20+65*q+(qm-1)*40+(niv("resto")-2)*3-(ev.prix>refBanquet()*1.2?5:0)),0,100);
  paye=note<45?Math.round(ev.total*0.5):ev.total;
  recette(t,"banquets",paye,"direct"); inscrire(t,"h:acomptes",-ev.acompte); S.acomptes-=ev.acompte;
  for(i=0;i<(ev.type==="mariage"?3:2);i++) avis(note);
  ev.etat="fini"; ev.note=note; ev.paye=paye; ev.manques=[qs<1?"serveurs":"",qc<1?"cuisiniers":"",d<B.denrees?"denrées":"",bo<B.boissons?"boissons":""].filter(Boolean);
  if(note<45) porterPlainte(nomEv(ev),t,0.4,ev.total*0.5,"fête gâchée");
  noter(t,note>=65?"ok":note>=45?"warn":"bad",nomEv(ev)+" : "+ev.n+" invités, note "+note+" / 100, "+mt(paye)+" encaissés"+(paye<ev.total?" (le client ne paie que la moitié)":"")+"."+(ev.manques.length?" Il manquait : "+ev.manques.join(", ")+".":""));
  S.evenements=S.evenements.filter(function(x){ return x.etat!=="fini"; }).concat(S.evenements.filter(function(x){ return x.etat==="fini"; }).slice(-6));
  reappro(t);
}
// Chaque nuit, une demande peut tomber, plus souvent quand le restaurant et la réputation sont bons
function demandesEv(t){
  var n=niv("resto"), enCours=S.evenements.filter(function(x){ return x.etat!=="fini"; }).length;
  if(n<2||enCours>=3) return;
  if(Math.random()<TAUX_BANQUET*(0.5+reputation()/100)*(1+0.2*(n-2))) creerEvenement(t);
}

/* ------------------------------------------------------------------ Le calendrier */
// Les clients de passage et les clients extérieurs d'une journée. Le restaurant, le bar et le spa ne reçoivent du monde
// de l'extérieur que pendant les postes où ils ont du personnel prévu.
function planifierJour(debut,apres,complet){
  var j=jourSemaine(debut+12*HEURE), midi=debut+12*HEURE, rep=0.5+reputation()/100, n=niv("resto");
  function semer(combien,h1,h2,o){
    var i, t, e, k;
    combien=Math.floor(combien)+(Math.random()<combien%1?1:0);
    for(i=0;i<combien;i++){ t=aHeure(debut,alea(h1,h2)); if(t>apres){ e={t:t}; for(k in o) e[k]=o[k]; S.arrivees.push(e); } }
  }
  if(complet){
    semer(attendus(midi)*PART_PASSAGE*alea(0.7,1.3),10,21,{k:"walk"});
    if(niv("seminaire")&&j<5&&Math.random()<Math.min(0.85,(0.25+0.07*niv("seminaire"))*demande("seminaire")*rep)) semer(1,9,9.2,{k:"sem"});
  }
  if(n>=2){
    if(!evenementLe(midi,"midi")&&prevusLe(["serveur"],j,"M",midi)&&prevusLe(CUISINE,j,"M",midi)) semer(EXT.midi[n]*rep*demande("resto")*alea(0.8,1.2),12,13.6,{k:"vis",v:"midi"});
    if(!evenementLe(midi,"soir")&&prevusLe(["serveur"],j,"A",midi)&&prevusLe(CUISINE,j,"A",midi)) semer(EXT.soir[n]*rep*demande("resto")*alea(0.8,1.2),19,20.8,{k:"vis",v:"soir"});
  }
  if(niv("bar")&&prevusLe(["barman"],j,"A",midi)) semer(EXT.bar[niv("bar")]*rep*demande("bar")*alea(0.8,1.2),17,21.2,{k:"vis",v:"bar"});
  if(niv("spa")){
    if(prevusLe(["praticien"],j,"M",midi)) semer(EXT.spa[niv("spa")]*0.45*rep*demande("spa")*alea(0.8,1.2),10,13.3,{k:"vis",v:"spa"});
    if(prevusLe(["praticien"],j,"A",midi)) semer(EXT.spa[niv("spa")]*0.55*rep*demande("spa")*alea(0.8,1.2),14,18.8,{k:"vis",v:"spa"});
  }
  S.arrivees.sort(function(a,b){ return a.t-b.t; });
}
// Quand le planning ou les équipements changent, les clients extérieurs encore à venir sont recalculés
function replanifier(t){
  S.arrivees=S.arrivees.filter(function(a){ return !(a.k==="vis"&&!a.sj); });
  planifierJour(minuit(t),t,false);
}
function planifierEvenement(debut){
  if(Math.random()<TAUX_EVENEMENT){ S.evts.push({t:aHeure(debut,alea(8,20))}); S.evts.sort(function(a,b){ return a.t-b.t; }); }
}
function monterPalier(t){
  var p=prochainPalier();
  while(p&&S.finis>=p.min&&reputation()>=p.rep){
    S.palier++;
    inscrire(t,"r:divers",p.prime);
    noter(t,"ok",S.nom+" devient « "+nomPalier(S.palier)+" ». L'office du tourisme verse une prime de "+mt(p.prime)+". Vous pouvez avoir jusqu'à "+p.chambres+" chambres, et les améliorer jusqu'au niveau "+p.niv+".");
    p=prochainPalier();
    reappro(t);
  }
}
// La journée d'un séminaire : la société paie sur facture, les pauses demandent un serveur et des boissons
function seminaire(t){
  var cap=capDe("seminaire"), n, prix, i, ok;
  if(!cap) return;
  n=entre(Math.max(4,Math.round(cap*0.4)),cap); prix=n*S.tarifs.seminaire;
  ok=prevusLe(["serveur"],posteDe(t).j,"M",t)>0;
  recette(t,"seminaire",prix,"entreprise");
  for(i=0;i<Math.ceil(n/4);i++){ if(stockDe("boissons")>0) sortirStock("boissons",t,"seminaire"); else { ok=false; manquer("boissons"); break; } }
  avis(ok?82:42); reappro(t);
  noter(t,ok?"ok":"warn","Séminaire de "+n+" participants : "+mt(prix)+" facturés à la société."+(ok?"":" Sans serveur ni boissons pour les pauses, les participants sont repartis déçus."));
}
// De temps en temps, un événement vient bousculer la journée
function declencher(t){
  var choix=["car","inspection","panne"], k, i, m, sj, n=0;
  if(reputation()>=65) choix.push("presse");
  if(niv("resto")>=2&&nbGroupe(CUISINE)) choix.push("critique");
  k=tirer(choix);
  if(k==="car"){
    for(i=0;i<4;i++){ sj=passage(t,true); if(sj) n++; }

    else { m=150*(S.palier+1); inscrire(t,"x:divers",m); noter(t,"bad","Inspection d'hygiène : les chambres ne sont pas assez bien tenues. Amende de "+mt(m)+"."); }
  } else if(k==="panne"){
    m=enPosteRole(["technicien"],t).length?80:300; achat(t,"e:batiment",m,TVA_NORMALE,"g82");
    noter(t,"warn","Panne de chaudière. "+(m<300?"Votre technicien s'en charge : "+mt(m)+" de pièces.":"Sans technicien en poste, il faut un dépanneur : "+mt(m)+"."));
  } else if(k==="presse"){
    avis(95); avis(95); noter(t,"ok","Un magazine de voyage recommande "+S.nom+". Sa réputation en profite.");
  } else {

    else { avis(40); noter(t,"warn","Un critique gastronomique a dîné au restaurant. Son article est tiède : la cuisine manque de métier."); }

}
// À minuit : paie, charges, nuitées, amortissements, démissions, règlements des sociétés, puis préparation de la journée suivante
function cloturer(t){
  var tj=t-1000, k, c, res, garde, vieux;
  S.equipe.forEach(function(e){
    var k=e.plan[jourSemaine(tj)], abs=absentLe(e,tj);
    var paie=paiePoste(e,k)+(abs&&e.absent.interim?paieInterim(e,k):0);
    inscrire(tj,"s:"+ROLES[e.role].service,paie); inscrire(tj,"o:"+ROLES[e.role].service,paie*TAUX_COTISATIONS);
    if(k!=="R"&&!abs) gagnerXp(e,estTache(e)?XP_POSTE_TACHE:XP_POSTE_AUTRE,tj);
  });
  achat(tj,"e:batiment",chargesBatiment(),TVA_NORMALE,"g82");
  for(k in EQUIP) achat(tj,"e:"+EQUIP[k].compte,entretienDe(k),TVA_NORMALE,"g82");
  inscrire(tj,"e:litiges",PRIME_ASSURANCE[S.palier]);
  S.sejours.forEach(function(sj){ if(sj.etat==="loge"&&sj.facturees<sj.nuits) nuitee(sj,tj); });
  amortir(tj);
  if(S.caisse<0) inscrire(tj,"x:divers",Math.max(1,-S.caisse*TAUX_DECOUVERT));
  financesPerso(tj);
  S.equipe.slice().forEach(function(e){
    var m=moralDe(e);
    if(m<30&&!charge(e)&&Math.random()<(30-m)/100){
      S.equipe.splice(S.equipe.indexOf(e),1); S.demandes=S.demandes.filter(function(x){ return x.qui!==e.id; });
      noter(tj,"bad",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") démissionne : le salaire et le planning ne lui conviennent plus.");
    }
  });
  c=S.cj[cleJour(tj)]||{}; res=recettesDe(c)-depensesDe(c);
  noter(tj,res>=0?"ok":"warn","Jour "+S.jour+" : "+pl(S.stat.arrives,"arrivée","arrivées")+", "+pl(S.stat.departs,"départ","départs")+", "+pl(occupees(),"chambre occupée","chambres occupées")+" cette nuit"+(S.stat.couverts?", "+pl(S.stat.couverts,"couvert","couverts"):"")+(S.stat.deloges?", "+pl(S.stat.deloges,"client envoyé","clients envoyés")+" ailleurs":"")+". Résultat de la journée : "+signeM(res)+".");
  // Le premier jour d'un trimestre : clôture de l'exercice qui s'achève et déclaration de TVA à déposer
  if(new Date(t).getDate()===1&&new Date(t).getMonth()%3===0){ cloturerExercice(tj,t); cloturerTva(tj,t); }
  S.declarations.slice().forEach(function(d){ if(d.limite<=t) deposerTva(d,t,true); });
  S.impots.slice().forEach(function(x){ if(x.limite<=t) payerImpot(x,t,true); });
  if(S.affectation&&S.affectation.limite<=t) affecterResultat(0,t,true);
  S.stat=statVide(); S.jour++;
  garde=cleJour(t-JOURS_GARDES*JOUR);
  for(vieux in S.cj) if(vieux<garde) delete S.cj[vieux];
  monterPalier(t);
  absences(t); reglements(t); ajusterDemande();
  S.plaintes.slice().forEach(function(x){ if(x.limite<=t) indemniser(x,t,true); });
  prendreReservations(t); demandesEv(t); planifierJour(t,t,true); planifierEvenement(t);
  affecterMenage(t); affecterVisites(t); reappro(t);
}
// Le temps réel : on rejoue dans l'ordre tout ce qui devait arriver jusqu'à l'instant donné
function avancer(jusqua){
  var change=false, garde=0, t, quoi, qui, i, x, e, q, a, sj, relais;
  if(!S.fondeLe) return false;
  while(garde++<400000){
    t=S.prochaineCloture; quoi="cloture"; qui=null; relais=relaisAccueil()>0;
    if(S.arrivees.length&&S.arrivees[0].t<t){ t=S.arrivees[0].t; quoi="prevu"; }
    if(S.evts.length&&S.evts[0].t<t){ t=S.evts[0].t; quoi="evenement"; }
    if(S.commandes.length&&S.commandes[0].t<t){ t=S.commandes[0].t; quoi="livraison"; }
    if(S.releve&&S.releve<t){ t=S.releve; quoi="releve"; }
    for(i=0;i<S.sejours.length;i++){
      x=S.sejours[i];
      if(x.etat==="reserve"){ e=x.arrive; q="arrivee"; }
      else if(x.etat==="accueil"){
        a=x.bloc?chambre(x.bloc):null;
        if(a&&!a.sj&&a.etat==="propre"){ e=S.horloge; q="bloc"; }
        else if(!x.bloc&&x.auto&&x.auto<=x.limite&&relais){ e=x.auto; q="relais"; } else { e=x.limite; q="depart"; }
      }
      else { e=x.fin; q="sortie"; }
      if(e<t){ t=e; quoi=q; qui=x; }
    }
    for(i=0;i<S.chambres.length;i++){ x=S.chambres[i]; if(x.etat==="menage"&&x.men&&x.men.fin<t){ t=x.men.fin; quoi="menage"; qui=x; } }
    for(i=0;i<S.visites.length;i++){
      x=S.visites[i];
      if(x.etat==="service"){ e=x.fin; q="vfin"; } else { e=x.limite; q="vrate"; }
      if(e<t){ t=e; quoi=q; qui=x; }
    }
    for(i=0;i<S.requetes.length;i++){
      x=S.requetes[i];
      if(x.auto&&x.auto<=x.limite&&relaisRequete()){ e=x.auto; q="rauto"; } else { e=x.limite; q="rfin"; }
      if(e<t){ t=e; quoi=q; qui=x; }
    }
    for(i=0;i<S.evenements.length;i++){
      x=S.evenements[i];
      if(x.etat==="demande"){ e=x.limite; q="evfin"; } else if(x.etat==="confirme"){ e=x.debut; q="ev"; } else continue;
      if(e<t){ t=e; quoi=q; qui=x; }
    }
    if(t>jusqua) break;
    if(t<S.horloge) t=S.horloge;
    change=true; S.horloge=t;
    if(quoi==="cloture"){ cloturer(t); S.prochaineCloture=prochainMinuit(t+1000); }
    else if(quoi==="prevu"){
      a=S.arrivees.shift(); sj=a.sj?parId(S.sejours,a.sj):null;
      if(a.k==="walk") passage(t,false);
      else if(a.k==="sem") seminaire(t);
      else if(a.k==="req"){ if(sj&&sj.etat==="loge") ouvrirRequete(sj,t); }
      else if(a.k==="vis"&&ouvertPour(a.v)){
        if(!a.sj) creerVisite(t,a.v,a.v==="spa"?1:a.v==="bar"?entre(1,3):entre(1,4),null);
        else if(sj&&sj.etat==="loge") creerVisite(t,a.v,a.v==="spa"?1:a.v==="bar"?Math.min(2,sj.pers):sj.pers,sj.id);
        affecterVisites(t);
      }
    }
    else if(quoi==="evenement"){ S.evts.shift(); declencher(t); }
    else if(quoi==="livraison"){ a=S.commandes.shift(); S.stock[a.p]=stockDe(a.p)+a.n; S.valStock[a.p]=(S.valStock[a.p]||0)+a.v; }
    else if(quoi==="releve"){ S.releve=prochaineReleve(t+1000); affecterMenage(t); affecterVisites(t); }
    else if(quoi==="arrivee") arriver(qui,t);
    else if(quoi==="relais") logerSeul(qui,t);
    else if(quoi==="bloc") loger(qui,chambre(qui.bloc),t,false);
    else if(quoi==="depart"){ if(peutPatienter(qui,t)) qui.limite=t+20*MIN; else repartir(qui,t,false); }
    else if(quoi==="sortie") quitter(qui,t);
    else if(quoi==="menage") finMenage(qui,t);
    else if(quoi==="vfin") finVisite(qui,t);
    else if(quoi==="vrate") visiteRatee(qui,t);
    else if(quoi==="rauto") repondreSeul(qui,t);
    else if(quoi==="ev") tenirEv(qui,t);
    else if(quoi==="evfin") refuserEv(qui,t,true);
    else requetePerdue(qui,t);
  }
  if(jusqua>S.horloge) S.horloge=jusqua;
  return change;
}
// Chaque nuit : le portefeuille d'actions rapporte entre 2 % et 7 % par an (le taux bouge un peu chaque jour),
// et l'hôtel verse au directeur les intérêts de ce qu'il lui a prêté.
function financesPerso(t){
  var M=S.moi, gain, entier;
  M.taux=borne(M.taux+(4.5-M.taux)*0.08+alea(-0.6,0.6),TAUX_MIN,TAUX_MAX);
  if(M.place>0){ gain=M.place*M.taux/100/365; M.place+=gain; M.gainsPlace+=gain; }
  if(M.pret>0){
    M.interets+=M.pret*TAUX_PRET/100/365; entier=Math.floor(M.interets);
    if(entier>=1){ inscrire(t,"x:pret",entier); M.argent+=entier; M.gainsPret+=entier; M.interets-=entier; }
  }
}
// Chaque nuit : retours d'absence, congés qui commencent, nouveaux malades et nouvelles demandes de congé
function partirEnConge(e,d,t,sansReponse){
  if(absentLe(e,t)) e.absent.fin=Math.max(e.absent.fin,d.fin); else e.absent={debut:d.debut,fin:d.fin,motif:"conge"};
  e.humeur={v:5,fin:jourApres(t,10)};
  if(sansReponse) noter(t,"",nomComplet(e)+" part en congé jusqu'au "+dateLongue(d.fin-1000)+" : sa demande est restée sans réponse.");
}
function absences(t){
  S.equipe.forEach(function(e){ if(e.absent&&e.absent.fin<=t) e.absent=null; });
  S.demandes=S.demandes.filter(function(d){
    var e=parId(S.equipe,d.qui);
    if(!e) return false;
    if(d.debut<=t){ partirEnConge(e,d,t,true); return false; }
    return true;
  });
  if(!S.portes) return;
  S.equipe.forEach(function(e){
    var n, debut;
    if(e.absent) return;
    if(Math.random()<TAUX_MALADIE*(moralDe(e)<40?2:1)){
      n=entre(1,3); e.absent={debut:t,fin:jourApres(t,n),motif:"maladie"};
      noter(t,"warn",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") est malade : "+pl(n,"jour","jours")+" d'absence.");
    } else if(!S.demandes.some(function(d){ return d.qui===e.id; })&&Math.random()<TAUX_CONGE){
      n=entre(2,5); debut=jourApres(t,DELAI_CONGE);
      S.demandes.push({id:S.nDemande++,qui:e.id,debut:debut,fin:jourApres(debut,n),jours:n});
      noter(t,"",nomComplet(e)+" ("+nomRole(e).toLowerCase()+") demande "+n+" jours de congé à partir du "+dateLongue(debut)+".");
    }
  });
}
// Le salaire du directeur : PAIE_DIRECTEUR par tranche de vingt minutes passées sur le jeu
function activite(ms){
  var paye=false;
  S.moi.actif+=ms; S.moi.tranche+=ms;
  while(S.moi.tranche>=TRANCHE){
    S.moi.tranche-=TRANCHE; S.moi.argent+=PAIE_DIRECTEUR; S.moi.gagne+=PAIE_DIRECTEUR; inscrire(maintenant(),"s:direction",PAIE_DIRECTEUR); paye=true;
  }
  return paye;
}

function ecranReglages(){

    +'<p class="aide"><b>Accueil.</b> Chaque client arrive avec deux ou trois souhaits et s\'attend à un certain niveau de chambre. Vous lisez sa fiche et vous lui donnez une chambre prête. Plus elle lui convient, plus il repart content. Sans réponse au bout de 15 minutes, la réception prend le relais ; aux chambres d\'hôtes, une boîte à clés dépanne. Sans personne à la réception, le client repart au bout d\'une heure.</p>'
    +'<p class="aide"><b>Réservations et agenda.</b> Chaque nuit, des réservations tombent pour les trois jours suivants. L\'hôtel n\'en prend pas plus qu\'il n\'a de chambres assez grandes. Dans l\'agenda, vous bloquez une chambre pour chaque réservation : elle n\'est plus proposée aux autres clients pour ces nuits-là, et le client s\'y installe tout seul à son arrivée. Sans chambre bloquée, il attend à la réception ; et s\'il ne reste plus de chambre à sa taille, l\'hôtel paie sa nuit ailleurs et sa réputation en souffre.</p>'
    +'<p class="aide"><b>Demandes.</b> Pendant le séjour, les clients ont des demandes et des réclamations. Vous choisissez la réponse. La meilleure dépend de ce que l\'hôtel a sous la main : un technicien en poste, une chambre prête, du stock. Sans réponse en 40 minutes, le client s\'en souvient.</p>'
    +'<p class="aide"><b>Chambres.</b> Vous commencez avec deux chambres doubles de niveau 1. Chaque palier permet d\'en acheter davantage. Une chambre a un type (simple, double, twin, familiale), un côté, un étage, et un niveau de 1 à 10 : chaque niveau ajoute un équipement et relève son prix.</p>'

    +'<p class="aide"><b>Équipements.</b> Restaurant, parking, hall, buanderie, puis bar, spa, salles de séminaire et piscine : chacun se construit et s\'améliore sur cinq niveaux. Le restaurant sert le petit-déjeuner au niveau 1, le déjeuner et le dîner dès le niveau 2. Restaurant, bar et spa reçoivent aussi des clients de l\'extérieur, quand le personnel est prévu au planning.</p>'
    +'<p class="aide"><b>Mariages et banquets.</b> Dès que le restaurant est au niveau 2, des clients demandent un devis pour un mariage, un anniversaire, un dîner de société ou une fête de famille. Vous fixez le prix par invité ; à la signature, le client verse 30 % d\'acompte. Le jour venu, le restaurant lui est réservé : il faut assez de serveurs et de cuisiniers au planning, des denrées et des boissons en stock, et bloquer dans l\'agenda les chambres des invités.</p>'
    +'<p class="aide"><b>Clientèle.</b> Voyageurs d\'affaires en semaine, couples et familles le week-end, familles l\'été, séminaires l\'automne. La tuile Clientèle donne les souhaits habituels de chacun.</p>'
    +'<p class="aide"><b>Réputation.</b> Elle suit la note des derniers séjours : chambre bien choisie, attentes remplies (petit-déjeuner, parking, bar…), demandes bien traitées, chambres bien tenues, attente à l\'arrivée, prix. Une bonne réputation attire plus de monde.</p>'
    +'<p class="aide"><b>Équipe.</b> Le salaire se règle par métier, pour un poste de 8 heures. Mal payée ou surchargée, une personne perd le moral, travaille moins bien et finit par démissionner. Chacun progresse en travaillant : junior, confirmé, senior. Un stage payé par l\'hôtel, une fois par jour et par personne, accélère la progression.</p>'
    +'<p class="aide"><b>Planning.</b> Chaque personne a sa semaine type : matin (6 h à 14 h), après-midi (14 h à 22 h) ou repos. Il n\'y a pas de poste de nuit. On ne paie que les postes travaillés. De temps en temps, une personne tombe malade ou demande un congé : vous répondez dans le planning, et un intérimaire peut tenir ses postes.</p>'

    +'<p class="aide"><b>Prix.</b> Personne ne refuse votre prix, mais un hôtel cher attire peu à peu moins de monde (voir Tarifs). Un client seul dans une grande chambre paie le prix d\'une chambre à sa taille.</p>'
    +'<p class="aide"><b>Qui paie.</b> La plupart des clients paient sur place. Les plateformes de réservation prennent 15 % de commission. Les sociétés paient sur facture, 5 à 8 jours plus tard, et en contestent parfois une partie : il faut alors les relancer dans Finances, sinon l\'argent est perdu.</p>'
    +'<p class="aide"><b>Comptabilité.</b> L\'hôtel paie 25 % de cotisations patronales sur les salaires. Une chambre, une amélioration ou un équipement sont amortis sur cinq ans. Une marchandise devient une charge quand elle sort du stock. Finances montre le résultat, le bilan et le passage du résultat à la caisse.</p>'
    +'<p class="aide"><b>TVA.</b> Tous les prix sont TVA comprise : 6 % sur les nuitées et les denrées, 12 % sur les repas, 21 % sur le reste. La TVA encaissée est due à l\'État, celle payée sur vos achats se récupère. Chaque trimestre, vous déposez la déclaration dans Finances avant le 20 du mois suivant : vous payez la différence, ou l\'État vous la rembourse. En retard, elle est déposée d\'office avec une amende.</p>'
    +'<p class="aide"><b>Clôture et impôt.</b> L\'exercice dure un trimestre. À la clôture, l\'hôtel doit 25 % d\'impôt des sociétés sur son bénéfice, à payer dans le mois ; une perte se reporte sur les exercices suivants. Une part du bénéfice va à la réserve légale, puis vous décidez du dividende : après 30 % de précompte mobilier, il arrive sur votre fiche.</p>'
    +'<p class="aide"><b>Votre argent.</b> Votre salaire vous appartient. Dans Ma fiche, vous pouvez suivre des formations, le placer en actions, le prêter à l\'hôtel, faire des dons ou vous offrir une vie en dehors de l\'hôtel.</p>'
    +'<p class="aide"><b>Paliers.</b> Chambres d\'hôtes, Petit hôtel ★★, Hôtel ★★★, Grand hôtel ★★★★, Palace ★★★★★. Chaque palier demande des séjours terminés et une réputation, et rapporte une prime.</p>'
    +'<p class="aide"><b>Argent.</b> L\'hôtel ne peut pas faire faillite. À découvert, la banque prélève 0,2 % par jour et les achats sont bloqués.</p></div>'
    +'<div class="carte"><h2>Recommencer</h2><p class="aide">Efface cette partie et repart de deux chambres vides.</p><div class="actions"><button type="button" class="btn danger" data-a="recommencer">'+(U.confirme==="recommencer"?"Confirmer : tout effacer":"Recommencer une partie")+'</button></div></div>';
}

var APPAREIL=(function(){ var id=null; try{ id=localStorage.getItem(CLE_APP); if(!id){ id="a"+Math.random().toString(36).slice(2,12); localStorage.setItem(CLE_APP,id); } }catch(e){} return id||"a"+Math.random().toString(36).slice(2,12); })();
var nuage={ref:null,connu:null,occupe:false,sale:false,dernier:0}, gel=false;
function marquer(){ S.modif=Date.now(); nuage.sale=true; }
function pousser(force){
  var t, corps;
  if(!nuage.ref||nuage.occupe||!nuage.sale||!S.fondeLe) return;
  if(!force&&Date.now()-nuage.dernier<15000) return;
  t=S.modif||Date.now(); corps={v:V,t:t,appareil:APPAREIL,json:JSON.stringify(S)};
  if(corps.json.length>200000){ S.registre.length=Math.min(S.registre.length,20); S.journal.length=Math.min(S.journal.length,40); corps.json=JSON.stringify(S); }
  nuage.occupe=true; nuage.sale=false; nuage.dernier=Date.now();
  nuage.ref.set(corps).then(function(){ nuage.connu=t; nuage.occupe=false; },function(e){
    nuage.occupe=false;
    if(e&&(e.code==="unavailable"||e.code==="resource_exhausted")) nuage.sale=true; else nuage.ref=null;
  });
}
function adopter(d){
  var o; try{ o=JSON.parse(d.json); }catch(e){ return false; }
  if(!valide(o)||!o.fondeLe) return false;
  S=o; migrer(); nuage.connu=d.t; nuage.sale=false; avancer(maintenant()); sauver(); return true;
}
function distant(d){ return !!(d&&d.json&&d.appareil!==APPAREIL&&d.t!==nuage.connu&&d.t>(nuage.connu||0)); }
function brancher(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(id){
      var ref;
      if(!id) return null;
      try{ ref=db.doc("data/users/"+id+"/partie"); }catch(e){ return null; }
      return ref.get().then(function(snap){
        var d=snap.exists?snap.data():null;
        nuage.ref=ref;
        if(d&&d.json&&(!S.fondeLe||d.t>(S.modif||0))){ if(adopter(d)) rendre(); }
        else { if(d) nuage.connu=d.t; if(S.fondeLe) nuage.sale=true; }
        ref.onSnapshot(function(s){
          var x=s.exists?s.data():null;
          if(s.metadata&&s.metadata.hasPendingWrites) return;
          if(distant(x)&&adopter(x)) rendre();
        },function(){});
        pousser(true);
        if(U.ecran==="reglages") rendre();
      });
    });
  }).catch(function(){});
}
// Au retour sur le jeu, on regarde d'abord si la partie a avancé sur un autre appareil
function revenir(){
  var fini=false;
  function suite(){ if(fini) return; fini=true; gel=false; battement(true); }
  if(!nuage.ref||!S.fondeLe){ battement(true); return; }
  gel=true; setTimeout(suite,4000);
  nuage.ref.get().then(function(snap){ var d=snap.exists?snap.data():null; if(distant(d)) adopter(d); suite(); },suite);
}

  if(donnees&&donnees.U){ U=donnees.U; for(k in base) if(U[k]===undefined) U[k]=base[k]; }
